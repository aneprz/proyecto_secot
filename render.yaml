services:
  - type: web
    name: proyecto-secot-backend
    runtime: python
    plan: free
    rootDir: backend
    # Use Render's managed virtualenv (python/pip on PATH). Avoid /usr/bin/python3 which bypasses the venv.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_CORS_ORIGIN_REGEX
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false
