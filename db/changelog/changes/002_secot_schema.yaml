databaseChangeLog:
  - changeSet:
      id: 002-senior
      author: proyecto_secot
      changes:
        - createTable:
            tableName: senior
            columns:
              - column:
                  name: senior_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: apellidos
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(254)
              - column:
                  name: movil
                  type: VARCHAR(30)
              - column:
                  name: fecha_alta
                  type: DATE
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: senior
            columnNames: email
            constraintName: uq_senior_email

  - changeSet:
      id: 003-grupo
      author: proyecto_secot
      changes:
        - createTable:
            tableName: grupo
            columns:
              - column:
                  name: grupo_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre_grupo
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: descripcion
                  type: TEXT
              - column:
                  name: color_hex
                  type: VARCHAR(7)
              - column:
                  name: responsable_senior_id
                  type: BIGINT
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: grupo
            baseColumnNames: responsable_senior_id
            referencedTableName: senior
            referencedColumnNames: senior_id
            constraintName: fk_grupo_responsable_senior
            onDelete: SET NULL
        - createIndex:
            tableName: grupo
            indexName: ix_grupo_responsable_senior_id
            columns:
              - column:
                  name: responsable_senior_id

  - changeSet:
      id: 004-centro
      author: proyecto_secot
      changes:
        - createTable:
            tableName: centro
            columns:
              - column:
                  name: centro_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre_centro
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: tipo_centro
                  type: VARCHAR(80)
              - column:
                  name: direccion
                  type: VARCHAR(255)
              - column:
                  name: municipio
                  type: VARCHAR(120)
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-actividad
      author: proyecto_secot
      changes:
        - createTable:
            tableName: actividad
            columns:
              - column:
                  name: actividad_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: grupo_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: centro_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: titulo_actividad
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: tipo_actividad
                  type: VARCHAR(80)
              - column:
                  name: senior_responsable_actividad_id
                  type: BIGINT
              - column:
                  name: estado_actividad
                  type: VARCHAR(60)
              - column:
                  name: fecha_inicio_prevista
                  type: DATE
              - column:
                  name: fecha_fin_prevista
                  type: DATE
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: actividad
            baseColumnNames: grupo_id
            referencedTableName: grupo
            referencedColumnNames: grupo_id
            constraintName: fk_actividad_grupo
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: actividad
            baseColumnNames: centro_id
            referencedTableName: centro
            referencedColumnNames: centro_id
            constraintName: fk_actividad_centro
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: actividad
            baseColumnNames: senior_responsable_actividad_id
            referencedTableName: senior
            referencedColumnNames: senior_id
            constraintName: fk_actividad_senior_responsable
            onDelete: SET NULL
        - createIndex:
            tableName: actividad
            indexName: ix_actividad_grupo_id
            columns:
              - column:
                  name: grupo_id
        - createIndex:
            tableName: actividad
            indexName: ix_actividad_centro_id
            columns:
              - column:
                  name: centro_id
        - createIndex:
            tableName: actividad
            indexName: ix_actividad_senior_resp_id
            columns:
              - column:
                  name: senior_responsable_actividad_id

  - changeSet:
      id: 006-sesion
      author: proyecto_secot
      changes:
        - createTable:
            tableName: sesion
            columns:
              - column:
                  name: sesion_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: actividad_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: grupo_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: centro_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fecha
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: hora_inicio
                  type: TIME
              - column:
                  name: hora_fin
                  type: TIME
              - column:
                  name: estado_sesion
                  type: VARCHAR(60)
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: sesion
            baseColumnNames: actividad_id
            referencedTableName: actividad
            referencedColumnNames: actividad_id
            constraintName: fk_sesion_actividad
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: sesion
            baseColumnNames: grupo_id
            referencedTableName: grupo
            referencedColumnNames: grupo_id
            constraintName: fk_sesion_grupo
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: sesion
            baseColumnNames: centro_id
            referencedTableName: centro
            referencedColumnNames: centro_id
            constraintName: fk_sesion_centro
            onDelete: RESTRICT
        - createIndex:
            tableName: sesion
            indexName: ix_sesion_actividad_id
            columns:
              - column:
                  name: actividad_id
        - createIndex:
            tableName: sesion
            indexName: ix_sesion_grupo_id
            columns:
              - column:
                  name: grupo_id
        - createIndex:
            tableName: sesion
            indexName: ix_sesion_centro_id
            columns:
              - column:
                  name: centro_id

  - changeSet:
      id: 007-senior-grupo
