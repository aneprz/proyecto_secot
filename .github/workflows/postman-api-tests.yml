name: Postman API tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  deployment_status:

jobs:
  postman:
    name: Run Postman (Newman)
    runs-on: ubuntu-latest
    # Needed to load Environment-scoped Variables/Secrets (Settings → Environments → Production)
    # If not set, the workflow runs self-contained against a local API + Postgres.
    environment: Production
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Allow configuration via GitHub Environment URL, repo Variables, or Secrets.
      BASE_URL: ${{ github.event.deployment_status.environment_url || vars.API_BASE_URL || secrets.API_BASE_URL }}
      AUTH_USER: ${{ vars.API_AUTH_USER || secrets.API_AUTH_USER }}
      AUTH_PASS: ${{ vars.API_AUTH_PASS || secrets.API_AUTH_PASS }}
      # By default we run self-contained against a local API+Postgres (more deterministic for CI).
      # Set RUN_REMOTE_TESTS=true to validate a deployed environment via BASE_URL.
      RUN_REMOTE_TESTS: ${{ vars.RUN_REMOTE_TESTS || secrets.RUN_REMOTE_TESTS }}
      # Opt into Node.js 24 runtime for JavaScript actions ahead of the runner default switch (June 2nd, 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Newman
        run: npm i -g newman

      - name: Start local API (unless RUN_REMOTE_TESTS=true)
        if: env.RUN_REMOTE_TESTS != 'true'
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          AUTH_SECRET_KEY: CI_CHANGE_ME
          AUTH_USERNAME: admin
          AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: "480"
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

          # Wait for Postgres service health.
          for i in $(seq 1 30); do
            python -c "import os; import psycopg; conn=psycopg.connect(os.environ['DATABASE_URL']); cur=conn.cursor(); cur.execute('select 1;'); cur.close(); conn.close()"
            if [ "$?" = "0" ]; then
              break
            fi
            sleep 2
          done

          # Minimal schema required for the Postman CRUD tests.
          python - <<'PY'
            import os
            import psycopg

            conn = psycopg.connect(os.environ['DATABASE_URL'])
            cur = conn.cursor()

            cur.execute('''
            create table if not exists senior (
              senior_id bigserial primary key,
              nombre varchar(120) not null,
              apellido1 varchar(80) not null,
              apellido2 varchar(80) not null,
              email_personal varchar(254),
              email_secot varchar(254),
              movil varchar(30),
              fecha_alta date,
              activo boolean not null default true
            );
            ''')
            cur.execute("select 1 from pg_constraint where conname = 'uq_senior_email_personal'")
            if cur.fetchone() is None:
                cur.execute('alter table senior add constraint uq_senior_email_personal unique (email_personal)')
            cur.execute("select 1 from pg_constraint where conname = 'uq_senior_email_secot'")
            if cur.fetchone() is None:
                cur.execute('alter table senior add constraint uq_senior_email_secot unique (email_secot)')

            cur.execute('''
            create table if not exists grupo (
              grupo_id bigserial primary key,
              nombre_grupo varchar(160) not null,
              descripcion text,
              color_hex varchar(7),
              canal_teams varchar(255),
              responsable_senior_id bigint,
              activo boolean not null default true
            );
            ''')
            cur.execute("select 1 from pg_constraint where conname = 'uq_grupo_nombre_grupo'")
            if cur.fetchone() is None:
                cur.execute('alter table grupo add constraint uq_grupo_nombre_grupo unique (nombre_grupo)')

            cur.execute('''
            create table if not exists centro (
              centro_id bigserial primary key,
              nombre_centro varchar(200) not null,
              tipo_centro varchar(80),
              direccion varchar(255),
              municipio varchar(120),
              responsable_centro varchar(200),
              email_responsable varchar(254),
              telefono_responsable varchar(30),
              observaciones text,
              activo boolean not null default true
            );
            ''')

            cur.execute('''
            create table if not exists actividad (
              actividad_id bigserial primary key,
              grupo_id bigint not null,
              centro_id bigint not null,
              titulo_actividad varchar(200) not null,
              descripcion text,
              tipo_actividad varchar(80),
              senior_responsable_actividad_id bigint,
              estado_actividad varchar(60),
              fecha_inicio_prevista date,
              fecha_fin_prevista date,
              activo boolean not null default true
            );
            ''')
            cur.execute("select 1 from pg_constraint where conname = 'fk_actividad_grupo' and conrelid = 'actividad'::regclass")
            if cur.fetchone() is None:
                cur.execute('alter table actividad add constraint fk_actividad_grupo foreign key (grupo_id) references grupo (grupo_id) on delete restrict')
            cur.execute("select 1 from pg_constraint where conname = 'fk_actividad_centro' and conrelid = 'actividad'::regclass")
            if cur.fetchone() is None:
                cur.execute('alter table actividad add constraint fk_actividad_centro foreign key (centro_id) references centro (centro_id) on delete restrict')

            cur.execute('''
            create table if not exists usuario (
              usuario_id bigserial primary key,
              username varchar(80) not null,
              email varchar(254),
              password_hash text not null,
              rol varchar(30) not null default 'user',
              senior_id bigint,
              activo boolean not null default true,
              creado_en timestamptz not null default now(),
              ultimo_login_en timestamptz
            );
            ''')
            cur.execute("select 1 from pg_constraint where conname = 'uq_usuario_username'")
            if cur.fetchone() is None:
                cur.execute('alter table usuario add constraint uq_usuario_username unique (username)')
            cur.execute("select 1 from pg_constraint where conname = 'uq_usuario_email'")
            if cur.fetchone() is None:
                cur.execute('alter table usuario add constraint uq_usuario_email unique (email)')

            conn.commit()
            cur.close()
            conn.close()
          PY

          # Create bcrypt hash for default Postman password: "admin".
          # NOTE: writing to $GITHUB_ENV only affects subsequent *steps*, so we also export it
          # for the uvicorn process started below.
          auth_hash="$(python -c "from passlib.context import CryptContext; pwd=CryptContext(schemes=['bcrypt']); print(pwd.hash('admin'))")"
          export AUTH_PASSWORD_HASH="${auth_hash}"
          echo "AUTH_PASSWORD_HASH=${auth_hash}" >> "$GITHUB_ENV"

          # Start FastAPI in background.
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning) &

          echo "NORMALIZED_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_STEP_SUMMARY"

      - name: Sanity check /health
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL}" ]; then
            echo "## Postman API tests" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Missing \`BASE_URL\`. Either set \`API_BASE_URL\` as a repo Variable/Secret or rely on the self-contained local mode." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          # Normalize URL (add scheme if missing, strip trailing slash).
          base="${BASE_URL%/}"
          if [[ "${base}" != http://* && "${base}" != https://* ]]; then
            base="https://${base}"
          fi

          echo "NORMALIZED_BASE_URL=${base}" >> "$GITHUB_ENV"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Target" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- RUN_REMOTE_TESTS=\`${RUN_REMOTE_TESTS:-}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- BASE_URL (raw)=\`${BASE_URL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- BASE_URL (normalized)=\`${base}\`" >> "$GITHUB_STEP_SUMMARY"

          : > /tmp/health.json
          : > /tmp/health.headers

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Health check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Probing \`GET ${base}/health\` (up to 30 attempts, 2s interval)..." >> "$GITHUB_STEP_SUMMARY"

          code=""
          for i in $(seq 1 30); do
            : > /tmp/health.json
            : > /tmp/health.headers
            code="$(curl -sS -D /tmp/health.headers -o /tmp/health.json -w "%{http_code}" "${base}/health" || true)"
            echo "  - Attempt ${i}: HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${code}" = "200" ]; then
              break
            fi
            sleep 2
          done

          echo "- GET /health -> HTTP **${code}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${code}" != "200" ]; then
            echo "Headers:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/health.headers >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Response:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/health.json >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run collection
        id: newman
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          pwd
          ls -la
          ls -la postman
          command -v npx || command -v newman
          npx newman --version || true

          if [ -z "${BASE_URL}" ]; then
            echo "Missing BASE_URL. Define secrets.API_BASE_URL or set deployment environment_url."
            exit 2
          fi

          # Only override username/password if provided; otherwise keep collection defaults.
          # This makes the workflow usable without secrets in dev/staging environments.
          newman_args=(
            --env-var "baseUrl=${NORMALIZED_BASE_URL:-${BASE_URL}}"
          )
          if [ -n "${AUTH_USER}" ]; then
            newman_args+=(--env-var "username=${AUTH_USER}")
          fi
          if [ -n "${AUTH_PASS}" ]; then
            newman_args+=(--env-var "password=${AUTH_PASS}")
          fi

          npx newman run postman/SECOT-Bizkaia-API.postman_collection.json \
            -e postman/SECOT-Bizkaia-API.postman_environment.json \
            "${newman_args[@]}" \
            --reporters cli,json \
            --reporter-json-export ./newman-report.json

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          if [ -f newman-report.json ]; then
            node scripts/postman/summarize-newman.mjs newman-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Postman API tests" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- `newman-report.json` not found (Newman did not run or failed before exporting the report)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload newman report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json
          if-no-files-found: warn

      - name: Fail job on test failures
        if: steps.newman.outcome == 'failure'
        run: exit 1
